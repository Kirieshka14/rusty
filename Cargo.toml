[package]
name = "rusty"
version = "0.1.0"
edition = "2021"
authors = ["xkiri <riz.riz1941@gmail.com>"]
description = "A fast, independent, rootless package manager for any Linux distribution"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Kirieshka14/rusty"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
indicatif = { version = "0.17", features = ["tokio"] }
colored = "2.1"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1.0"
zstd = "0.13"
anyhow = "1.0"
directories = "5.0"
tempfile = "3.10"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
which = "6.0"
